<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ChurnGuard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  {% block head_extra %}{% endblock %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --salmon:   #ff7360;
      --salmon10: rgba(255,115,96,.10);
      --seashell: #f5f0ec;
      --smoke:    #f8f6f5;
      --charcoal: #252525;
      --ink:      #181818;
      --gray:     #646464;
      --muted:    #9a9a9a;
      --border:   #e2e2e2;
      --soft:     #ede8e3;
      --hdr-h:    52px;
    }

    body {
      font-family: 'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif;
      background: var(--seashell);
      color: var(--charcoal);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header { background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
    .hdr {
      max-width:1160px; margin:0 auto; padding:0 32px;
      height:var(--hdr-h); display:flex; align-items:center; justify-content:space-between;
    }
    .logo { display:flex; align-items:center; gap:7px; text-decoration:none; }
    .logo span { font-size:15px; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
    .logo i { width:6px; height:6px; border-radius:50%; background:var(--salmon); }
    .hdr-nav { display:flex; align-items:center; gap:24px; }
    .nav-link { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); text-decoration:none; transition:color .2s; }
    .nav-link:hover { color:var(--ink); }
    .nav-link.active { color:var(--salmon); }

    /* ── Hero ── */
    .hero { background:var(--seashell); padding:40px 0 32px; border-bottom:1px solid var(--border); }
    .hero-inner { max-width:1160px; margin:0 auto; padding:0 32px; }
    .hero-eye { font-size:10px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--salmon); margin-bottom:10px; }
    .hero-title { font-size:clamp(1.7rem,3.5vw,2.6rem); font-weight:700; line-height:1.08; letter-spacing:-.025em; color:var(--ink); margin-bottom:8px; }
    .hero-sub { font-size:14px; font-weight:300; color:var(--gray); line-height:1.6; }

    /* ── Two-column layout ── */
    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 28px 32px 80px;
      display: grid;
      grid-template-columns: var(--left-w, 420px) 1fr;
      gap: 24px;
      align-items: start;
    }
    .col-left {
      position: sticky;
      top: calc(var(--hdr-h) + 16px);
      max-height: calc(100vh - var(--hdr-h) - 32px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--soft) transparent;
    }
    .col-left::-webkit-scrollbar { width: 4px; }
    .col-left::-webkit-scrollbar-thumb { background: var(--soft); border-radius: 2px; }
    .col-right { min-width: 0; }

    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; }
      .col-left { position: static; max-height: none; overflow-y: visible; }
    }
    @media (max-width: 600px) {
      .page, .hdr, .hero-inner { padding-left: 16px; padding-right: 16px; }
    }

    /* ── Card ── */
    .card { background:#fff; border:1px solid var(--border); box-shadow:0 0 0 1px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05); }
    .card + .card { margin-top: 2px; }
    .card-hdr { padding:10px 18px; border-bottom:1px solid var(--soft); background:var(--smoke); display:flex; align-items:center; justify-content:space-between; }
    .card-lbl { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--gray); }
    .card-meta { font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
    .card-body { padding:18px; }
    .card-divider { height:1px; background:var(--soft); margin:0 18px; }

    /* ── Button ── */
    .btn {
      width:100%; background:var(--salmon); color:#fff; border:none;
      padding:13px 18px; font-family:inherit; font-size:11px; font-weight:700;
      letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
      margin-top:10px; transition:opacity .2s;
    }
    .btn:hover { opacity:.87; }
    .btn:disabled { opacity:.42; cursor:not-allowed; }

    /* ── Error banner ── */
    .err { display:none; margin-bottom:10px; border-left:3px solid #e63b2e; background:#fff8f7; padding:11px 14px; font-size:13px; color:#c0392b; }

    /* ── Placeholder ── */
    .placeholder {
      border:1px dashed var(--border);
      padding:48px 32px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; gap:14px; min-height:320px;
    }
    .placeholder-dot { width:40px; height:40px; border-radius:50%; background:var(--salmon10); display:flex; align-items:center; justify-content:center; }
    .placeholder-dot svg { width:18px; height:18px; stroke:var(--salmon); fill:none; stroke-width:2; stroke-linecap:round; }
    .placeholder-title { font-size:14px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
    .placeholder-sub { font-size:13px; font-weight:300; color:var(--muted); max-width:260px; line-height:1.6; }

    /* ── Footer ── */
    footer { border-top:1px solid var(--border); background:#fff; }
    .ftr { max-width:1160px; margin:0 auto; padding:13px 32px; display:flex; justify-content:space-between; gap:10px; font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

    {% block styles %}{% endblock %}
  </style>
</head>
<body>

<header>
  <div class="hdr">
    <a href="/" class="logo"><span>ChurnGuard</span><i></i></a>
    <nav class="hdr-nav">
      <a href="/" class="nav-link {% block nav_predict %}{% endblock %}">Predict</a>
      <a href="/train" class="nav-link {% block nav_train %}{% endblock %}">Test</a>
      <a href="https://github.com/Limeload/customer-churn-prediction" target="_blank" rel="noopener" class="nav-link">GitHub →</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    {% block hero %}{% endblock %}
  </div>
</section>

{% block content %}{% endblock %}

<footer>
  <div class="ftr">
    <span>ChurnGuard &middot; MIT</span>
    <span>{% block footer_stack %}Flask &middot; scikit-learn &middot; XGBoost{% endblock %}</span>
  </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
